appId: com.ffconverter.app
productName: FF-Converter
electronVersion: 43.2.0
copyright: Copyright © 2026 FF-Converter contributors
asar: true
npmRebuild: true
buildDependenciesFromSource: false
directories:
  output: ../../dist-app
  buildResources: ../../build

publish:
  provider: github
  owner: wilkinbarban
  repo: FF-Converter
  releaseType: draft
files:
  - dist/**/*
  - package.json
  - node_modules/**/*
extraResources:
  - from: ../../resources/ffmpeg
    to: ffmpeg
    filter:
      - "*.md"
      - "*.json"
      - "*.txt"
  - from: ../../LICENSE
    to: LICENSE.txt
  - from: ../../resources/ffmpeg/THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: ../../build/icon.png
    to: app-icon.png
  - from: ../../build/icon.ico
    to: app-icon.ico
win:
  executableName: FF-Converter
  icon: ../../build/icon.ico
  signtoolOptions:
    certificateSubjectName: FF-Converter Personal Development
    publisherName: FF-Converter Personal Development
    signingHashAlgorithms:
      - sha256
  requestedExecutionLevel: asInvoker
  extraResources:
    - from: ../../resources/ffmpeg/win32-x64
      to: ffmpeg/win32-x64
      filter:
        - "**/*"
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: FF-Converter-${version}-setup-${arch}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
linux:
  executableName: ff-converter
  icon: ../../build/icon.png
  maintainer: FF-Converter contributors <noreply@ff-converter.local>
  syncDesktopName: true
  extraResources:
    - from: ../../resources/ffmpeg/linux-x64
      to: ffmpeg/linux-x64
      filter:
        - "**/*"
  artifactName: FF-Converter-${version}-${arch}.${ext}
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: Video
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2 | libasound2t64
